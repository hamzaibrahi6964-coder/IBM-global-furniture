<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | IBM Global Furniture</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <h1>Login</h1>
      <p>Access your profile and order faster.</p>

      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email Address" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit" class="btn primary-btn full-btn">Login</button>
      </form>

      <p id="loginMessage" class="form-message"></p>
      <p class="auth-switch">Don’t have an account? <a href="signup.html">Create one</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ecixygqmmfdaljpqyzkj.supabase.co";
    const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY_HERE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginForm = document.getElementById("loginForm");
    const loginMessage = document.getElementById("loginMessage");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      loginMessage.textContent = "Logging in...";

      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        loginMessage.textContent = error.message;
        return;
      }

      loginMessage.textContent = "Login successful.";
      window.location.href = "products.html";
    });
  </script>
</body>
</html>
