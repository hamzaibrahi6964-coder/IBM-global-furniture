<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IBM Global Furniture | Admin Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard-body">

  <header class="dashboard-header">
    <div class="container dashboard-topbar">
      <div class="dashboard-brand">
        <img src="logo.png" alt="Logo">
        <div>
          <h2>IBM GLOBAL FURNITURE</h2>
          <p>Admin Dashboard</p>
        </div>
      </div>
    </div>
  </header>

  <section class="dashboard-section">
    <div class="container">
      <div class="dashboard-welcome">
        <h1>Manage Furniture Products</h1>
        <p>Add products directly to Supabase.</p>
      </div>

      <div class="dashboard-grid">
        <div class="dashboard-card add-product-card">
          <h2>Add New Product</h2>

          <form id="productForm" class="admin-form">
            <input type="text" id="productName" placeholder="Product Name" required />
            <input type="text" id="productCategory" placeholder="Category" required />
            <input type="text" id="productPrice" placeholder="Price" required />
            <textarea id="productDescription" rows="5" placeholder="Product Description" required></textarea>
            <input type="text" id="productImageUrl" placeholder="Paste Image URL" required />

            <button type="submit" class="btn primary-btn full-btn">Add Product</button>
            <p id="productMessage" class="form-message"></p>
          </form>
        </div>

        <div class="dashboard-card stats-card">
          <h2>Quick Info</h2>
          <div class="stats-boxes">
            <div class="stat-box">
              <h3 id="totalProducts">0</h3>
              <p>Total Products</p>
            </div>
            <div class="stat-box">
              <h3>Live</h3>
              <p>Catalog Status</p>
            </div>
          </div>
        </div>
      </div>

      <div class="dashboard-card product-list-card">
        <div class="product-list-top">
          <h2>All Products</h2>
          <button id="refreshBtn" class="btn primary-btn">Refresh</button>
        </div>

        <div id="productsContainer" class="admin-product-grid"></div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ecixygqmmfdaljpqyzkj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cGw6sDpRlMo9iN8VnOU6Rw_nJT2e_N2";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const productForm = document.getElementById("productForm");
    const productMessage = document.getElementById("productMessage");
    const productsContainer = document.getElementById("productsContainer");
    const totalProducts = document.getElementById("totalProducts");
    const refreshBtn = document.getElementById("refreshBtn");

    async function loadProducts() {
      productsContainer.innerHTML = "<p>Loading products...</p>";

      const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        productsContainer.innerHTML = `<p>${error.message}</p>`;
        return;
      }

      totalProducts.textContent = data.length;

      if (!data.length) {
        productsContainer.innerHTML = "<p>No products added yet.</p>";
        return;
      }

      let html = "";

      data.forEach((product) => {
        html += `
          <div class="admin-product-card">
            <img src="${product.imageUrl || ''}" alt="${product.name || 'Product'}">
            <div class="admin-product-info">
              <h3>${product.name || ''}</h3>
              <p><strong>Category:</strong> ${product.category || ''}</p>
              <p><strong>Price:</strong> ${product.price || ''}</p>
              <p>${product.description || ''}</p>
              <button class="btn delete-btn" data-id="${product.id}">Delete</button>
            </div>
          </div>
        `;
      });

      productsContainer.innerHTML = html;

      document.querySelectorAll(".delete-btn").forEach((button) => {
        button.addEventListener("click", async () => {
          const id = button.getAttribute("data-id");
          const ok = confirm("Delete this product?");
          if (!ok) return;

          const { error } = await supabaseClient
            .from("products")
            .delete()
            .eq("id", id);

          if (error) {
            alert(error.message);
            return;
          }

          loadProducts();
        });
      });
    }

    productForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("productName").value.trim();
      const category = document.getElementById("productCategory").value.trim();
      const price = document.getElementById("productPrice").value.trim();
      const description = document.getElementById("productDescription").value.trim();
      const imageUrl = document.getElementById("productImageUrl").value.trim();

      productMessage.textContent = "Adding product...";

      const { error } = await supabaseClient
        .from("products")
        .insert([
          { name, category, price, description, imageUrl }
        ]);

      if (error) {
        productMessage.textContent = error.message;
        return;
      }

      productMessage.textContent = "Product added successfully.";
      productForm.reset();
      loadProducts();
    });

    refreshBtn.addEventListener("click", loadProducts);

    loadProducts();
  </script>
</body>
</html>
