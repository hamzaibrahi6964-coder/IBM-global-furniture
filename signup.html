<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | IBM Global Furniture</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p>Sign up once and your details will be saved for faster ordering.</p>

      <form id="signupForm">
        <input type="text" id="fullName" placeholder="Full Name" required />
        <input type="tel" id="phone" placeholder="Phone Number" required />
        <input type="email" id="email" placeholder="Email Address" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" class="btn primary-btn full-btn">Create Account</button>
      </form>

      <p id="signupMessage" class="form-message"></p>
      <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ecixygqmmfdaljpqyzkj.supabase.co";
    const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY_HERE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const signupForm = document.getElementById("signupForm");
    const signupMessage = document.getElementById("signupMessage");

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const full_name = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      signupMessage.textContent = "Creating account...";

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password
      });

      if (error) {
        signupMessage.textContent = error.message;
        return;
      }

      const user = data.user;

      if (user) {
        const { error: profileError } = await supabaseClient
          .from("profiles")
          .insert([
            {
              id: user.id,
              full_name,
              phone,
              email
            }
          ]);

        if (profileError) {
          signupMessage.textContent = profileError.message;
          return;
        }
      }

      signupMessage.textContent = "Account created successfully. Check your email if confirmation is required.";
      signupForm.reset();
    });
  </script>
</body>
</html>
